<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Flight Forest starting area</title><desc id="desc">Schematic of guaranteed resource deposits, starter power, fruit groves, water, lava and ammonia. North is up. Normal enemies live outside the cleared starting region.</desc>
