[mod-name]
starter_initializer=Starter Initializer

[mod-description]
starter_initializer=Configurable on-demand starter supplies. Automatic grants are disabled by default.

[mod-setting-name]
starter-init-mode=Initialization mode
starter-init-all-item-count=Count per all-producible item
starter-init-all-fluid-amount=Amount per all-producible fluid
starter-init-custom-default-count=Default amount for custom entries
starter-init-custom-items=Custom starter entries
starter-init-auto-grant-on-join=Auto-grant on player creation
starter-init-include-hidden-recipes=Include hidden recipe outputs

[mod-setting-description]
starter-init-mode=Choose whether to grant all producible items, only your custom list, or both.
starter-init-all-item-count=How many of each producible item to grant when mode includes all-producible.
starter-init-all-fluid-amount=How much of each producible fluid to grant in all-producible mode. Fluids are placed in storage tanks near the player.
starter-init-custom-default-count=Used when a custom entry does not explicitly include a count or amount.
starter-init-custom-items=Comma-separated list of item/fluid names. Examples: iron-plate=1000,transport-belt=400,water=25000
starter-init-auto-grant-on-join=Disabled by default. If you enable this, each player is granted starter entries once when they are created. The manual /starter_init_grant command works regardless of this setting.
starter-init-include-hidden-recipes=If enabled, hidden recipe products are included in all-producible mode.

[string-mod-setting]
starter-init-mode-all-producible=All producible
starter-init-mode-custom-only=Custom only
starter-init-mode-all-and-custom=All producible + custom
